name: ATM-Expert CI

on:
  push:
    branches: [ main, 'dev*/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run tests
        run: |
          # Currently running existing tests in inference_engine/tests/
          # If no tests exist yet, this will just exit gracefully
          python -m pytest inference_engine/tests/ || echo "No tests found yet"

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Install dependencies
        run: |
          cd ui
          if [ -f package.json ]; then npm install; fi
      - name: Run linting/tests
        run: |
          cd ui
          if [ -f package.json ]; then npm test || echo "No tests found yet"; fi
