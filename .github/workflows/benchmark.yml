name: ATM-Expert Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run 200-scenario benchmark
        run: |
          python benchmark/run_benchmark.py
      - name: Check accuracy threshold
        run: |
          # The target accuracy is ≥ 85% as per README
          # This assumes run_benchmark.py returns a non-zero exit code if target isn't met
          # Or we can parse the output here
          accuracy=$(grep -Po '"accuracy": \K[0-9.]+' benchmark/benchmark_results.json || echo "0")
          echo "Current Accuracy: $accuracy%"
          if (( $(echo "$accuracy < 85" | bc -l) )); then
            echo "Error: Benchmark accuracy is below 85%!"
            exit 1
          fi
      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: benchmark/benchmark_results.json
